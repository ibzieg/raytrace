[workspace]
resolver = "3"
members = ["crates/raytrace", "crates/raytrace-cli", "crates/raytrace-viewer"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
debug = "line-tables-only"

# Rendering is unusable without optimizations, so optimize even dev builds of
# the hot crates.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.raytrace]
opt-level = 3
