# A rippled glass pane floating in front of a checker wall and a few objects.
# Looking through it, the ripples bend the view of everything behind. With
# photon mapping (on by default here), the key light behind the pane focuses
# through the ripples into rings of caustics on the floor in front of it.
# Without it, shadow rays treat the glass as opaque.
#
# The pane mesh is generated by crates/raytrace/examples/ripple_glass.rs.

[camera]
eye = [0.0, 2.6, 9.0]
target = [0.0, 1.9, 0.0]
near = 1.0
far = 1000.0
window = { left = -0.5333, right = 0.5333, bottom = -0.4, top = 0.4 }

[[light]]  # key light, behind and above the pane
position = [1.5, 6.0, -2.5]
diffuse = [0.7, 0.7, 0.65]
specular = [1.0, 1.0, 1.0]

[[light]]  # fill light near the camera
position = [-4.0, 6.0, 8.0]
diffuse = [0.45, 0.45, 0.5]
specular = [0.6, 0.6, 0.6]

[[material]]
name = "floor"
kd = [0.8, 0.8, 0.78]
ks = [0.0, 0.0, 0.0]

[[material]]
name = "red"
ka = [0.05, 0.0, 0.0]
kd = [0.85, 0.12, 0.1]
ks = [0.8, 0.8, 0.8]
shininess = 90.0

[[material]]
name = "yellow"
ka = [0.05, 0.04, 0.0]
kd = [0.9, 0.75, 0.1]
ks = [0.6, 0.6, 0.6]
shininess = 60.0

[[material]]
name = "gold"
ka = [0.05, 0.04, 0.0]
kd = [0.75, 0.55, 0.15]
ks = [1.0, 0.9, 0.6]
shininess = 120.0
reflectivity = 0.3

[[object]]
mesh = "../objects/quad.obj"
translate = [0.0, 0.0, 1.0]
scale = [7.0, 1.0, 5.5]
material = "floor"

[[object]]  # checker wall
mesh = "../objects/CheckerPlane_8x5_280.obj"
translate = [0.0, 3.5, -4.5]
scale = 0.5

[[object]]
mesh = "../objects/ripple_glass.obj"
translate = [0.0, 2.3, 0.0]
rotate = [0.0, -12.0, 0.0]
scale = 2.0

[[object]]
mesh = "../objects/sphere.obj"
translate = [-1.4, 1.0, -2.4]
material = "red"

[[object]]
mesh = "../objects/cone_32v_r2_h4.obj"
translate = [1.5, 0.9, -3.0]
scale = [0.45, 0.45, 0.45]

[[object]]
mesh = "../objects/sphere.obj"
translate = [0.3, 0.6, -1.6]
scale = 0.6
material = "yellow"

[[object]]
mesh = "../objects/torus_4_1.obj"
translate = [0.3, 3.0, -3.4]
rotate = [90.0, 0.0, 0.0]
scale = 0.17
material = "gold"

[render]
height = 600
samples = 4
max_depth = 8
soft_shadows = true

[photon]
enabled = true
photons_per_light = 2000000
radius = { direct = 0.9, indirect = 1.5, caustic = 0.12 }
